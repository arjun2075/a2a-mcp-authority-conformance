name: conformance

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit + end-to-end tests (pytest)
        run: python -m pytest tests/ -v

      - name: Run secure conformance scenario (expect exit 0, CONFORMANCE PASS)
        run: python run_conformance.py

      - name: Run vulnerability detector (expect nonzero exit)
        run: |
          if python run_conformance.py --simulate-vulnerable; then
            echo "ERROR: vulnerable implementation incorrectly passed"
            exit 1
          else
            echo "OK: vulnerable implementation was correctly detected as non-conformant"
          fi
