[project]
name = "a2a-mcp-authority-conformance"
version = "0.2.0"
description = "Conformance fixture: delegated authority attenuation survives Human -> Agent A -> A2A Agent B -> MCP -> Tool"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk>=1.1.2,<2",
    "mcp>=2.1.1,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
